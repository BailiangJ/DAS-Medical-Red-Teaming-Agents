name: tests

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  no-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall src scripts
      - run: python -m pytest -m "not live"
