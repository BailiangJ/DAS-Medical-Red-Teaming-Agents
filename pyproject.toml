[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "das-medical-red-teaming-agents"
version = "2.0.0.dev0"
description = "Modular red-teaming framework for evaluating medical language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DAS Medical Red-Teaming Authors" }]
dependencies = [
  "pandas>=1.3.0",
  "pydantic>=2.0",
  "tqdm>=4.60.0",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
api = [
  "openai>=1.0.0",
  "anthropic>=0.7.0",
  "google-genai>=1.27.0",
  "google-cloud-aiplatform>=1.129.0",
  "openai-agents>=0.2.3",
]
open-source = [
  "transformers>=4.40",
  "vllm>=0.6",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/med_red_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires provider credentials or a local model runtime",
]
addopts = "-ra"
