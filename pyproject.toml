[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "das-medical-red-teaming-agents"
version = "2.0.0.dev0"
description = "Modular red-teaming framework for evaluating medical language models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DAS Medical Red-Teaming Authors" }]
dependencies = [
  "pandas>=1.3.0",
  "pydantic>=2.0",
  "tqdm>=4.60.0",
  "openpyxl>=3.1.5",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
api = [
  "openai>=1.0.0",
  "anthropic>=0.7.0",
  "google-genai>=1.27.0",
  "openai-agents>=0.2.3",
]
hallucination = [
  "openai>=1.0.0",
  "openai-agents>=0.2.3",
]
hallucination-claude = [
  "anthropic>=0.7.0",
  "claude-agent-sdk>=0.1.0",
]
analysis = [
  "scipy>=1.10.0",
]
open-source = [
  "transformers>=4.40",
  "vllm>=0.6",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/JZPeterPan/DAS-Medical-Red-Teaming-Agents"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires provider credentials or a local model runtime",
]
strict_markers = true
addopts = "-ra -m 'not live'"
